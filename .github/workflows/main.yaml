name: Main CI/CD

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  base-ref-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure base workflow refs match the vendored .base/.version
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < .base/.version)"
          if [ -z "$expected" ]; then
            echo "::error::.base/.version is empty"
            exit 1
          fi
          echo "Expected base ref: ${expected}"
          status=0
          # Collect every ycpss91255-docker/base/...@vX.Y.Z ref used across workflows.
          while IFS= read -r ref; do
            if [ "${ref}" != "${expected}" ]; then
              echo "::error::base ref '${ref}' does not match .base/.version '${expected}'"
              status=1
            fi
          done < <(grep -rhoE 'uses:[[:space:]]*ycpss91255-docker/base/[^@]+@v[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/*.yaml \
                     | grep -oE '@v[0-9]+\.[0-9]+\.[0-9]+' | sed 's/^@//' | sort -u)
          if [ "${status}" -ne 0 ]; then
            echo "Bump the @vX.Y.Z refs in .github/workflows/*.yaml to match .base/.version."
          fi
          exit "${status}"

  # System + acceptance lane for the L4T data-store lifecycle (#93). The bats
  # suites in the image stub mount / mkfs / docker; this job does the real
  # thing with sudo on the runner: loop-mount an in-repo ext4 image, check
  # setuid + ownership survive, tear down, purge, and prove `rm -rf <clone>`
  # leaves no mount / loop device behind. Skips itself (exit 0 with a reason)
  # if the runner has no passwordless sudo or loop support.
  store-loop-system:
    needs: base-ref-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: L4T data-store loop lifecycle (setup → teardown → purge)
        env:
          STORE_SYSTEM_STRICT: "1"   # a missing capability fails the job instead of skipping
        run: bash test/system/store_loop_system.sh

  call-docker-build:
    needs: base-ref-drift
    uses: ycpss91255-docker/base/.github/workflows/build-worker.yaml@v0.39.0
    with:
      image_name: jetson_sdk_manager
      build_runtime: false
      build_args: |
        BASE_IMAGE=ubuntu:22.04

  call-release:
    needs: call-docker-build
    if: startsWith(github.ref, 'refs/tags/')
    uses: ycpss91255-docker/base/.github/workflows/release-worker.yaml@v0.39.0
    with:
      archive_name_prefix: jetson_sdk_manager
