# JetPack/board/storage alias → NVIDIA-canonical name mapping.
#
# This file is COPY'd into the image at build time (NOT bind-mounted at
# runtime) so the prepare/flash images are self-contained — the user's
# editable `jetson.yaml` only references aliases, never URLs.
#
# Adding a new JetPack release:
#   1. Confirm L4T release + download URLs on
#      https://developer.nvidia.com/embedded/jetson-linux-archive
#   2. Append a new key under `jetpack_to_l4t`
#   3. Commit + tag a downstream release so users get the new option
#      via `git pull && make build`
#
# Adding a new board:
#   1. Confirm the canonical `--target` name in NVIDIA's BSP docs
#      (look for valid arguments to `l4t_initrd_flash.sh --target`)
#   2. Append a new key under `board_alias_to_target`
#   3. Add a sample `<alias>-<storage>.yaml` variant in this directory

jetpack_to_l4t:
  "6.2.2":
    l4t_release: R36.5.0
    l4t_archive_tag: r36_release_v5.0
    bsp_url: https://developer.nvidia.com/downloads/embedded/l4t/r36_release_v5.0/release/Jetson_Linux_r36.5.0_aarch64.tbz2
    rootfs_url: https://developer.nvidia.com/downloads/embedded/l4t/r36_release_v5.0/release/Tegra_Linux_Sample-Root-Filesystem_r36.5.0_aarch64.tbz2

board_alias_to_target:
  agx-orin: jetson-agx-orin-devkit
  orin-nx: jetson-orin-nx-devkit-super
  orin-nano: jetson-orin-nano-devkit-super

# Maps the user-facing `storage.device` alias to one of two shapes that
# script/lib/yaml.sh::resolve_storage_device understands:
#
#   1. The reserved keyword "internal" — eMMC / on-module storage.
#      Resolver returns (mode=internal, device=""). prepare.sh / flash.sh
#      pass the literal `internal` as l4t_initrd_flash.sh's positional
#      storage-type argument and skip every --external-* flag.
#
#   2. Any other string — treated as the Jetson recovery initrd's kernel
#      device name (e.g. `nvme0n1p1`, `sda1`). Resolver returns
#      (mode=external, device=<value>); prepare.sh / flash.sh pass it via
#      `--external-device` and append the `external` positional. The user
#      may override this default at runtime via `storage.device_path` in
#      jetson.yaml (e.g. set `sdb1` when a multi-slot USB card reader
#      exposes the card on a non-default LUN).
storage_alias_to_device:
  emmc: internal
  nvme: nvme0n1p1
  usb: sda1
