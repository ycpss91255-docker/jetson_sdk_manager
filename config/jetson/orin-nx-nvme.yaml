# Orin NX devkit (Super) — flash to M.2 NVMe SSD (typical).
# See _example.yaml for the canonical schema with all options.

jetpack:
  version: "6.2.2"

hardware:
  board: orin-nx

storage:
  device: nvme

user:
  username: jetson
  # SECURITY: 'jetson/jetson' is a default — change it before `prepare` or with
  # `passwd` on the device after first boot. See _example.yaml.
  password: jetson
  hostname: jetson-orin-nx
  autologin: false
